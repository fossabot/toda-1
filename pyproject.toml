[build-system]
requires = ["setuptools>=77", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "toda"
dynamic = ["version"]
description = "Toda gives you the power to safely deploy files using symlinks on any operating system with Python installed."
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "hgto", email = "77352283+hgto@users.noreply.github.com" }]
keywords = ["dotfiles", "symlink", "environment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: BSD",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/hgto/toda"
Repository = "https://github.com/hgto/toda"
Issues = "https://github.com/hgto/toda/issues"

[project.scripts]
toda = "toda.__main__:main"

[dependency-groups]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.16",
    "twine>=5.1",
    "zizmor>=1.30",
]

[tool.setuptools.packages.find]
include = ["toda*"]

[tool.setuptools.package-data]
toda = ["py.typed"]

[tool.setuptools_scm]
fallback_version = "0.0.1"
local_scheme = "no-local-version"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
# The codebase uses str.format() throughout; UP030-UP032 would rewrite every
# call site to an f-string for no behavioural gain.
ignore = ["UP030", "UP031", "UP032"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["toda"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
