name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --group dev

      - name: Run tests with coverage
        run: >-
          uv run --no-sync pytest tests/ -v
          --cov=toda --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@2320916714171c258d01dbd81040d64d798c6f8e  # v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run ruff check
        run: uv run --no-sync ruff check toda tests

      - name: Run ruff format check
        run: uv run --no-sync ruff format --check toda tests

      - name: Run mypy
        run: uv run --no-sync mypy toda

      - name: Lint workflows
        run: uv run --no-sync zizmor --min-severity medium .github/workflows

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Build package
        run: uv build

      - name: Check package metadata
        run: uv run --no-sync twine check dist/*
