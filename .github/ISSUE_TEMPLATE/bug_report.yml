name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before reporting, please include the smallest manifest that reproduces
        the problem. Do not paste the contents of your dotfiles.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command you ran and its full output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: manifest
    attributes:
      label: Minimal manifest
      description: The smallest MANIFEST that reproduces the problem.
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: toda version
      description: Output of `toda --version`.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - BSD
        - Other
    validations:
      required: true
